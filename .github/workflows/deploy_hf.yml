name: Deploy to Hugging Face Spaces

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://huggingface.co/spaces/Neolau971/SPACE_NAME
          git push https://Neolau971:$HF_TOKEN@huggingface.co/spaces/Neolau971/SPACE_NAME main