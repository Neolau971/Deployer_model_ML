# mkdocs.yml
site_name: Deployer Model ML
site_description: API de prédiction de départ d'employés avec Machine Learning
site_author: N.Ulrick

# Repository
repo_name: ulric/deployer_model_ML
repo_url: https://github.com/Neolau971/Deployer_model_ML.git
edit_uri: blob/main/docs/

# Thème Material
theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Navigation
nav:
  - Main: main.md
  - Database: api/db.md
  - Schemas: api/schemas.md
  - Tests: testing.md

# Plugins
plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [.]  # Chemin pour trouver les modules
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            merge_init_into_class: true

# Extensions Markdown
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true


  
